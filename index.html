    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap');

        :root {
            --primary: #2c87ae;
            --primary-light: #eaf4fa;
            --accent: #f7630c;
            --success: #2e7d32;
            --text-main: #2b2b2b;
            --bg-body: #f4f7f9;
        }

        body { font-family: 'Noto Sans KR', sans-serif; text-align: center; background-color: var(--bg-body); padding: 16px 8px; margin: 0; color: var(--text-main); user-select: none; }
        
        .teacher-header { margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .teacher-image { max-height: 60px; width: auto; object-fit: contain; border-radius: 8px; }
        .main-title { color: var(--primary); font-weight: 700; margin: 0; font-size: 22px; letter-spacing: -0.5px; }

        .content-box { background-color: #ffffff; max-width: 480px; margin: 0 auto; padding: 20px; border-radius: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); box-sizing: border-box; }
        .sub-title { color: #666; font-size: 14px; margin: 0 0 14px 0; }
        #welcome-msg { font-weight: bold; font-size: 15px; margin: 0 0 10px 0; color: var(--primary); }

        .word-card { background: linear-gradient(135deg, #f0f7fb 0%, #e1eff8 100%); padding: 12px; border-radius: 12px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .card-top-row { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
        .card-word { font-size: 26px; font-weight: bold; color: #1a4f66; background: #fff; padding: 2px 14px; border-radius: 6px; }
        .card-pinyin { font-size: 18px; font-weight: bold; color: var(--accent); background: #fff; padding: 2px 10px; border-radius: 4px; border: 1px solid #ffd6c9; }
        .card-meaning { font-size: 15px; font-weight: 600; color: #444; margin-top: 2px; word-break: keep-all; }

        #grid-container { display: flex; justify-content: center; margin: 10px 0; }
        #character-target { width: 220px; height: 220px; border: 3px solid var(--primary); background-color: #fff; border-radius: 12px; box-shadow: 0 4px 12px rgba(44,135,174,0.12); }
        
        .button-group { display: flex; justify-content: center; gap: 10px; margin: 14px 0 6px 0; }
        .btn { padding: 11px 20px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; color: white; transition: all 0.15s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.12); }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .btn:disabled { background-color: #e0e0e0 !important; color: #a0a0a0 !important; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .btn-start { background-color: var(--primary); padding: 12px 36px; font-size: 16px; margin-top: 10px; }
        .btn-speak { background-color: #7e57c2; }
        .btn-next { background-color: var(--success); }
        .btn-submit { background-color: var(--primary); padding: 14px 30px; font-size: 16px; width: 100%; margin-top: 15px; border-radius: 12px; }
        
        #status { font-size: 13px; margin-top: 10px; font-weight: 600; color: var(--primary); background-color: var(--primary-light); padding: 6px 14px; border-radius: 20px; display: inline-block; min-height: 20px; }
        input[type="text"], select { padding: 11px 16px; font-size: 15px; width: 100%; max-width: 320px; border: 2px solid #ddd; border-radius: 50px; text-align: center; margin-bottom: 12px; outline: none; box-sizing: border-box; }
        input[type="text"]:focus, select:focus { border-color: var(--primary); }

        /* 🧩 짝 맞추기 매트릭스 그리드 스타일 */
        .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
        .tile { min-height: 64px; aspect-ratio: 1; border-radius: 10px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; font-weight: bold; cursor: pointer; border: 2px solid transparent; transition: all 0.15s ease; box-sizing: border-box; }
        .tile:hover { transform: scale(1.02); }
        .tile.selected { border-color: var(--primary); background-color: #cbe7f5; }
        .tile.matched { opacity: 0.18; pointer-events: none; border-color: transparent; }
        .tile.wrong { animation: shake 0.3s; background-color: #fdecea; border-color: #e57373; }
        .tile-py { font-size: 15px; color: var(--primary); font-family: 'Segoe UI', Verdana, sans-serif; }
        .tile-mean { font-size: 12px; color: #333; line-height: 1.25; }

        .report-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .report-table th, .report-table td { padding: 9px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        .big-accuracy { font-size: 34px; font-weight: 800; color: #d32f2f; display: block; margin-top: 4px; }

        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    </style>
</head>

            </div>
            <div id="status"></div>
        </div>

            '7-2': { title: '7과 본문 2 어휘', items: [

            'song-1': { title: '[노래 어휘 1] 너의 곁에 1', items: [
                { char: '长', word: '长得', pinyin: 'zhǎngde', meaning: '~하게 생기다' },
                { char: '丑', word: '丑', pinyin: 'chǒu', meaning: '못생기다' },
                { char: '活', word: '活', pinyin: 'huó', meaning: '살다' },
                { char: '久', word: '久', pinyin: 'jiǔ', meaning: '오래되다' },
                { char: '帅', word: '帅', pinyin: 'shuài', meaning: '잘생기다' },
                { char: '老', word: '老', pinyin: 'lǎo', meaning: '늙다' },
                { char: '快', word: '快', pinyin: 'kuài', meaning: '빠르다' },
                { char: '宁', word: '宁愿', pinyin: 'nìngyuàn', meaning: '차라리 ~하다' },
                { char: '积', word: '积极', pinyin: 'jījí', meaning: '적극적이다' },
                { char: '可', word: '可爱', pinyin: "kě'ài", meaning: '귀엽다' }
            ]},
            'song-2': { title: '[노래 어휘 2] 너의 곁에 2', items: [
                { char: '胖', word: '胖', pinyin: 'pàng', meaning: '뚱뚱하다' },
                { char: '日', word: '日子', pinyin: 'rìzi', meaning: '날들, 생활' },
                { char: '旺', word: '旺', pinyin: 'wàng', meaning: '번창하다' },
                { char: '做', word: '做', pinyin: 'zuò', meaning: '되다, 하다' },
                { char: '平', word: '平凡', pinyin: 'píngfán', meaning: '평범하다' },
                { char: '陪', word: '陪', pinyin: 'péi', meaning: '함께하다' },
                { char: '身', word: '身旁', pinyin: 'shēnpáng', meaning: '곁, 옆' }
            ]}
        };

        let itemList = [];
        let currentTitle = "";
        let currentIndex = 0;
        let writer = null;
        let studentName = "";
        let totalStrokesAttempted = 0;
        let totalMistakes = 0;
        let isCharacterComplete = false;
        let finalAccuracyScore = 0;

        function startLearning() {
            const nameInput = document.getElementById('student-name').value.trim();
            if(!nameInput) { alert("학번과 이름을 반드시 입력해야 합니다!"); return; }
            studentName = nameInput;
            
            const selectedLesson = document.getElementById('lesson-select').value;
            itemList = lessonData[selectedLesson].items;
            currentTitle = lessonData[selectedLesson].title;
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('learning-screen').style.display = 'block';
            document.getElementById('welcome-msg').innerText = `👋 [${studentName}] 학생, 시작합니다!`;
            
            initWriter();
        }

        function initWriter() {
            const currentItem = itemList[currentIndex];
            const targetContainer = document.getElementById('character-target');
            targetContainer.innerHTML = '';
            
            document.getElementById('card-word').innerText = currentItem.word;
            document.getElementById('card-pinyin').innerText = currentItem.pinyin;
            document.getElementById('card-meaning').innerText = currentItem.meaning;
            
            document.getElementById('speak-btn').disabled = true;
            document.getElementById('next-btn').disabled = true; 
            isCharacterComplete = false; 

            // 메모리 누수 방지 및 캔버스 초기화
            writer = HanziWriter.create('character-target', currentItem.char, {
                width: 220, 
                height: 220, 
                showOutline: true, 
                showHintAfterMisses: 1, 
                strokeColor: '#2c87ae', 
                outlineColor: '#eceff1', 
                drawingWidth: 15,
                strokeAnimationSpeed: 1.5,
                delayBetweenStrokes: 100
            });

            // 1. 글자 로드 시 획순 자동 1회 재생
            document.getElementById('status').innerText = `👀 [${currentIndex + 1}/${itemList.length}] 획순을 잘 보세요...`;
            writer.animateCharacter({
                onComplete: function() {
                    document.getElementById('status').innerText = `✍️ 획을 따라 써 보세요! (1회 쓰기)`;
                    startQuiz();
                }
            });
        }

        function startQuiz() { 
            if (!writer) return;
            writer.quiz({ 
                onCorrectStroke: function() { totalStrokesAttempted++; },
                onMistake: function() { totalStrokesAttempted++; totalMistakes++; },
                onComplete: function() { 
                    isCharacterComplete = true; 
                    document.getElementById('speak-btn').disabled = false; 
                    document.getElementById('status').innerText = "🎯 완료! [🔊 발음 듣기]를 누르세요.";
                } 
            }); 
        }

        // 고신뢰성 TTS 재생 엔진: 구글 1차 시도 실패 시 유다오 사전 MP3로 무중단 전환
        function speakCurrentChar() {
            const wordToSpeak = itemList[currentIndex].word;
            const encodedWord = encodeURIComponent(wordToSpeak);
            
            const googleUrl = "https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q=" + encodedWord;
            const youdaoUrl = "https://dict.youdao.com/dictvoice?audio=" + encodedWord + "&le=zh";

            const audio = new Audio(googleUrl);
            const triggerNext = () => {
                if (isCharacterComplete) {
                    document.getElementById('next-btn').disabled = false; 
                    document.getElementById('status').innerText = "✨ 청취 완료! [다음 ➔]을 누르세요.";
                }
            };

            audio.play().then(triggerNext).catch(() => {
                const fbAudio = new Audio(youdaoUrl);
                fbAudio.play().then(triggerNext).catch(() => {
                    triggerNext(); // 음원 서비스 모두 실패 시에도 학생 멈춤 방지
                });
            });
        }

        function handleNextStep() {
            if (currentIndex < itemList.length - 1) { 
                currentIndex++; 
                initWriter(); 
            } else { 
                startMatchingGame(); // 쓰기 완료 시 짝 맞추기 미션 오픈
            }
        }

        /* ================= 🧩 짝 맞추기 매트릭스 엔진 ================= */
        let matchCards = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let matchAttempts = 0;
        let matchMistakes = 0;

        function startMatchingGame() {
            document.getElementById('learning-screen').style.display = 'none';
            document.getElementById('match-screen').style.display = 'block';

            // 중복 단어 제거(고유화) 후 최대 8쌍(16장, 4x4 매트릭스) 슬라이싱
            const uniqueMap = new Map();
            itemList.forEach(item => {
                if (!uniqueMap.has(item.word)) {
                    uniqueMap.set(item.word, item);
                }
            });

            const uniqueItems = Array.from(uniqueMap.values()).slice(0, 8);
            totalPairs = uniqueItems.length;
            matchedPairs = 0;
            matchAttempts = 0;
            matchMistakes = 0;

            matchCards = [];
            uniqueItems.forEach((item, idx) => {
                matchCards.push({ id: idx, type: 'py', text: item.pinyin });
                matchCards.push({ id: idx, type: 'mean', text: item.meaning.split('/')[0].split(',')[0].trim() });
            });

            // Fisher-Yates 셔플 알고리즘 적용 (완전 무작위 배분)
            for (let i = matchCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [matchCards[i], matchCards[j]] = [matchCards[j], matchCards[i]];
            }

            renderMatchGrid();
        }

        function renderMatchGrid() {
            const grid = document.getElementById('match-grid');
            grid.innerHTML = '';
            document.getElementById('remain-count').innerText = (totalPairs - matchedPairs) * 2;

            matchCards.forEach((card, index) => {
                const tile = document.createElement('div');
                tile.className = `tile ${card.type === 'py' ? 'tile-py' : 'tile-mean'}`;
                tile.innerText = card.text;
                tile.onclick = () => onCardClick(tile, card);
                grid.appendChild(tile);
            });
        }

        function onCardClick(tile, card) {
            if (tile.classList.contains('matched') || tile.classList.contains('selected') || selectedCards.length >= 2) return;

            tile.classList.add('selected');
            selectedCards.push({ tile, card });

            if (selectedCards.length === 2) {
                matchAttempts++;
                const [first, second] = selectedCards;

                // ID가 같고 유형(병음 vs 뜻)이 다를 때 짝 성립
                if (first.card.id === second.card.id && first.card.type !== second.card.type) {
                    setTimeout(() => {
                        first.tile.classList.remove('selected');
                        second.tile.classList.remove('selected');
                        first.tile.classList.add('matched');
                        second.tile.classList.add('matched');
                        selectedCards = [];
                        matchedPairs++;
                        document.getElementById('remain-count').innerText = (totalPairs - matchedPairs) * 2;

                        if (matchedPairs === totalPairs) {
                            setTimeout(() => {
                                alert("🎉 축하합니다! 단어 짝을 모두 완벽하게 맞췄습니다!");
                                showFinalReport();
                            }, 350);
                        }
                    }, 200);
                } else {
                    matchMistakes++;
                    setTimeout(() => {
                        first.tile.classList.add('wrong');
                        second.tile.classList.add('wrong');
                        setTimeout(() => {
                            first.tile.classList.remove('selected', 'wrong');
                            second.tile.classList.remove('selected', 'wrong');
                            selectedCards = [];
                        }, 300);
                    }, 350);
                }
            }
        }

        /* ================= 📊 리포트 및 GAS 전송 로직 ================= */
        function showFinalReport() {
            document.getElementById('match-screen').style.display = 'none';
            document.getElementById('report-screen').style.display = 'block';

            const now = new Date();
            const dateString = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            let writeAcc = 100;
            if (totalStrokesAttempted > 0) {
                writeAcc = Math.round(((totalStrokesAttempted - totalMistakes) / totalStrokesAttempted) * 100);
            }
            let matchAcc = 100;
            if (matchAttempts > 0) {
                matchAcc = Math.round(((matchAttempts - matchMistakes) / matchAttempts) * 100);
            }
            if (writeAcc < 0) writeAcc = 0;
            if (matchAcc < 0) matchAcc = 0;

            finalAccuracyScore = Math.round((writeAcc * 0.5) + (matchAcc * 0.5));

            document.getElementById('rep-title').innerText = currentTitle;
            document.getElementById('rep-name').innerText = studentName;
            document.getElementById('rep-date').innerText = dateString;
            document.getElementById('rep-accuracy').innerText = `${finalAccuracyScore}%`;
        }

        function sendDataToGoogle() {
            const btn = document.getElementById('submit-btn');
            btn.innerText = "⏳ 전송 중입니다... 잠시만 기다리세요";
            btn.disabled = true;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000); // 7초 타임아웃 방어

            const payload = {
                name: studentName,
                lesson: currentTitle,
                accuracy: finalAccuracyScore
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal
            })
            .then(() => {
                clearTimeout(timeoutId);
                btn.innerText = "✅ 전송 완료!";
                btn.style.backgroundColor = "var(--success)";
                alert("성공적으로 제출되었습니다! 창을 닫고 활동지를 확인하세요.");
            })
            .catch(() => {
                clearTimeout(timeoutId);
                btn.innerText = "🚀 다시 전송 시도하기";
                btn.disabled = false;
                alert("네트워크 연결이 지연되고 있습니다. 다시 전송 버튼을 누르거나 선생님께 화면을 보여주세요!");
            });
        }
    </script>
